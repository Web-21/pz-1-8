<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Телебачення Онлайн</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Верхнє меню -->
  <header>
    <nav class="menu">
      <ul>
        <li><a href="#">Телеканали</a></li>
        <li><a href="#">Фільми</a></li>
        <li><a href="#">Мультфільми</a></li>
        <li><a href="#">Серіали</a></li>
        <li><a href="#">Шоу</a></li>
        <li><a href="#">Спорт</a></li>
        <li><a href="#">Освіта</a></li>
      </ul>
      <div class="auth">
        <a href="#">UA</a> | <a href="#">Увійти</a>
      </div>
    </nav>
  </header>

  <!-- Блок банера -->
  <section class="banner">
    <img src="img/banner.jpg" alt="Банер" class="banner-image">
    <h1>Ворон</h1>
    <p>+18 Екшн, Фентезі</p>
    <button class="premiere-btn">Рання прем'єра</button>
  </section>

  <!-- Блок "Зараз на ТБ" -->
  <section class="tv-now">
    <h2>Зараз на ТБ</h2>
    <div class="channel">
      <h3>ICTV2</h3>
      <p>Т/с "CSI: Місце злочину - Маямі"</p>
      <span>10:30</span>
      <span>ЕФІР</span>
    </div>
    <div class="channel">
      <h3>2+2</h3>
      <p>Т/с "Опер за викликом"</p>
      <span>06:50</span>
      <span>ЕФІР</span>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
